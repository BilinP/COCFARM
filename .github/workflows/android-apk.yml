name: android-apk

# Builds COCFARM for Android (android/) on every push to the android branch,
# keeps the app as the run's artifact, and (when signed with the release
# key) publishes it as a release of its own, tagged android-v<version>-<run>,
# with COCFARM-android.apk as its only download. It's never marked latest:
# that stays the Windows app's (main's windows-exe), which the README links
# to. Phones find the newest release that has COCFARM-android.apk (see
# farmbot/update.py), and only take one newer than theirs.
#
# Signing uses three repository secrets (Settings → Secrets and variables →
# Actions):
#   ANDROID_KEYSTORE_BASE64  the release keystore, base64-encoded
#   ANDROID_KEY_ALIAS        the key's alias in it
#   COCFARM_KEY_PASSWORD     its password (the keystore's and the key's)
# Without them (a fork, say) a debug build is made instead: fine for trying
# out, but it can't update an installed release build, so it's never
# published.

on:
  push:
    branches: [android]
  pull_request:
    branches: [android]

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      APK: COCFARM-android.apk
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Chaquopy prepares the app's Python packages with the same Python
      # version the app runs (3.10, see app/build.gradle.kts).
      - uses: actions/setup-python@v5
        id: python
        with:
          python-version: "3.10"

      # The runner has the Android SDK (ANDROID_HOME); with its licences
      # accepted, Gradle fetches the platform and build tools the app needs.
      - name: Accept the Android SDK licences
        shell: bash
        run: (yes || true) | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null

      - uses: gradle/actions/setup-gradle@v4

      - name: Read the version
        id: version
        shell: bash
        run: |
          version=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' farmbot/__init__.py)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "COCFARM $version for Android"

      - name: Set up the release key
        id: key
        shell: bash
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          PASSWORD: ${{ secrets.COCFARM_KEY_PASSWORD }}
        run: |
          {
            echo "sdk.dir=$ANDROID_HOME"
            echo "python.path=${{ steps.python.outputs.python-path }}"
          } > android/local.properties
          if [[ -z "$KEYSTORE" || -z "$ALIAS" || -z "$PASSWORD" ]]; then
            echo "::warning::No release key secrets: making a debug build, which isn't attached to a release."
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          key="$RUNNER_TEMP/cocfarm-key"
          mkdir -p "$key"
          echo "$KEYSTORE" | base64 --decode > "$key/release.keystore"
          printf 'storeFile=%s\nkeyAlias=%s\n' "$key/release.keystore" "$ALIAS" > "$key/keystore.properties"
          echo "release.keystore=$key/keystore.properties" >> android/local.properties
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Build
        working-directory: android
        shell: bash
        env:
          COCFARM_KEY_PASSWORD: ${{ secrets.COCFARM_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          if [[ "${{ steps.key.outputs.signed }}" == "true" ]]; then
            ./gradlew --no-daemon assembleRelease
            cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/$APK"
          else
            ./gradlew --no-daemon assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/$APK"
          fi

      - name: Check the signature
        shell: bash
        run: |
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          certs=$("$apksigner" verify --print-certs "$APK")
          echo "$certs"
          if [[ "${{ steps.key.outputs.signed }}" == "true" ]] && ! grep -q "CN=COCFARM" <<<"$certs"; then
            echo "::error::Not signed with COCFARM's release key"
            exit 1
          fi
          echo "SHA-256 $(sha256sum "$APK" | cut -d' ' -f1), $(du -h "$APK" | cut -f1)"

      - uses: actions/upload-artifact@v4
        with:
          name: COCFARM-android-${{ steps.version.outputs.version }}${{ steps.key.outputs.signed != 'true' && '-debug' || '' }}
          path: ${{ env.APK }}
          retention-days: 30

      - name: Publish the release
        if: github.event_name == 'push' && steps.key.outputs.signed == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-v${{ steps.version.outputs.version }}-${{ github.run_number }}
          name: COCFARM for Android ${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          make_latest: false
          files: ${{ env.APK }}
          body: |
            ## Download

            1. On your phone, download **COCFARM-android.apk** below and open it. Android asks to allow installing apps from your browser: allow it once.
            2. Open COCFARM and follow its setup.

            Already have COCFARM for Android? It offers this version on its home screen by itself.

            > [!WARNING]
            > Using this bot can get your Clash of Clans account banned. Only use it on an account you're willing to lose.
