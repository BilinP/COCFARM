name: windows-exe

# Builds COCFARM.exe on Windows from the source and tests it.
#  - Every push / pull request: the build is attached to the run as an artifact.
#  - Every push to main (e.g. merging a pull request): also publishes a
#    GitHub Release with COCFARM-windows.zip, tagged v<version>-<run number>
#    (version from pyproject.toml), so users just download, unzip and
#    double-click COCFARM.exe.
#  - Pushing a tag like v1.2.0, or running this workflow by hand with a
#    version, publishes a release under that exact version instead.

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version to publish, e.g. v1.0.0 (empty: build only)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e . pyinstaller
      - run: python packaging/build.py
      - name: Self-test the built exe
        shell: pwsh
        run: |
          $p = Start-Process dist/COCFARM/COCFARM.exe -ArgumentList "--self-test" -WorkingDirectory dist/COCFARM -Wait -PassThru
          if (Test-Path dist/COCFARM/farmbot.log) { Get-Content dist/COCFARM/farmbot.log }
          if ($p.ExitCode -ne 0) { throw "self-test failed with exit code $($p.ExitCode)" }
          Remove-Item dist/COCFARM/farmbot.log, dist/COCFARM/selftest.toml -ErrorAction SilentlyContinue
      - uses: actions/upload-artifact@v4
        with:
          name: COCFARM-windows
          path: dist/COCFARM/
          retention-days: 30

      - name: Pick the release version
        id: release
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          elif [[ -n "${{ github.event.inputs.version }}" ]]; then
            echo "tag=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          elif [[ "$GITHUB_REF" == refs/heads/main ]]; then
            version=$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml)
            echo "tag=v${version}-${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish the GitHub Release
        if: steps.release.outputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          name: COCFARM ${{ steps.release.outputs.tag }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          make_latest: true
          files: dist/COCFARM-windows.zip
          body: |
            ## Download

            1. Download **COCFARM-windows.zip** below and unzip it anywhere (for example `Documents\COCFARM`).
            2. Install **BlueStacks 5** or **LDPlayer 9**, and Clash of Clans inside it.
            3. Double-click **COCFARM.exe**. If Windows warns about an unknown publisher, choose **More info → Run anyway**.

            Nothing else to install. See the README for the full guide.
